<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Open World Prototype - External Model</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: Arial, sans-serif; }
        #info {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.6); padding: 12px; border-radius: 6px;
            font-size: 14px; pointer-events: none; z-index: 10;
        }
        #inventory {
            position: absolute; top: 10px; right: 10px; color: white;
            background: rgba(0,0,0,0.6); padding: 12px; border-radius: 6px;
            font-size: 14px; pointer-events: none; z-index: 10;
        }
        #playerName {
            pointer-events: auto;
            width: 96px;
            margin-top: 6px;
        }
        #minimap {
            position: absolute; bottom: 15px; left: 15px;
            border: 2px solid rgba(255,255,255,0.7); border-radius: 8px;
            background: rgba(0,0,0,0.4); z-index: 10;
        }
        #message {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            color: #90EE90; background: rgba(0,0,0,0.7); padding: 8px 16px;
            border-radius: 4px; font-size: 16px; pointer-events: none; z-index: 10; display: none;
        }
        #error {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ff6b6b; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 8px;
            font-size: 16px; max-width: 400px; text-align: center; z-index: 20; display: none;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="info">
        <strong>Open World Prototype</strong><br>
        W/S: Forward / Back<br>
        A/D: Turn<br>
        Space: Jump &nbsp; Shift: Sprint<br>
        1: Axe &nbsp; 2: Pickaxe<br>
        E: Swing / Gather<br>
        Hold Right Mouse: Rotate Camera<br>
        Mouse Wheel: Zoom<br>
        <small>Player: human model &nbsp;|&nbsp; NPCs: minion model (served by server)</small>
    </div>
    <div id="inventory">
        Tool: <span id="toolName">Axe</span><br>
        Wood: <span id="woodCount">0</span><br>
        Stone: <span id="stoneCount">0</span><br>
        <span id="playerColor" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#ccc;vertical-align:middle;"></span>
        <input id="playerName" maxlength="16" placeholder="Name">
    </div>
    <canvas id="minimap" width="180" height="180"></canvas>
    <div id="message"></div>
    <div id="error"></div>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { clone as cloneSkinned } from 'three/addons/utils/SkeletonUtils.js';
        import { chunkResources, CHUNK_SIZE } from './worldgen.js';

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = 'Error: ' + msg + '\n\nCheck browser console (F12) for details.';
            el.style.display = 'block';
            console.error(msg);
        }

        function showMessage(text) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 1500);
        }

        try {
            const scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x87CEEB, 40, 180);
            scene.background = new THREE.Color(0x87CEEB);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x87CEEB, 1);
            renderer.shadowMap.enabled = true;
            renderer.domElement.style.outline = 'none';
            renderer.domElement.tabIndex = -1;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x404040, 0.7);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
            directionalLight.position.set(50, 100, 50);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            const groundGeometry = new THREE.PlaneGeometry(3000, 3000);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Character group (model will be loaded into it)
            const characterGroup = new THREE.Group();
            characterGroup.position.y = 0;
            scene.add(characterGroup);

            let mixer = null;
            let idleAction = null;
            let attackAction = null;
            let modelLoaded = false;
            let playerTemplate = null;
            let playerClips = [];
            const remoteMixers = [];
            const resourceHits = new Map();
            const colliderById = new Map();

            let persistentId = localStorage.getItem('ow-id');
            if (!persistentId) {
                persistentId = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
                localStorage.setItem('ow-id', persistentId);
            }
            let playerName = localStorage.getItem('ow-name') || 'Player';
            let gameSocket = null;
            const nameInput = document.getElementById('playerName');
            nameInput.value = playerName;

            // Load player model from server
            const loader = new GLTFLoader();
            loader.load(
                '/models/player.glb',
                (gltf) => {
                    const model = gltf.scene;
                    const box = new THREE.Box3().setFromObject(model);
                    const size = box.getSize(new THREE.Vector3());
                    const scale = 1.8 / size.y;
                    model.scale.setScalar(scale);
                    box.setFromObject(model);
                    model.position.y = -box.min.y;
                    characterGroup.add(model);
                    playerTemplate = model;
                    playerClips = gltf.animations || [];
                    upgradeRemotePlayers();

                    if (gltf.animations && gltf.animations.length) {
                        mixer = new THREE.AnimationMixer(model);
                        idleAction = mixer.clipAction(gltf.animations[0]);
                        idleAction.play();
                    }
                    modelLoaded = true;
                    console.log('Player model loaded');
                },
                undefined,
                (err) => showError('Failed to load player model: ' + err.message)
            );

            // Load NPC model and spawn a few minions
            loader.load(
                '/models/npc.glb',
                (gltf) => {
                    for (let i = 0; i < 5; i++) {
                        const npc = cloneSkinned(gltf.scene);
                        const box = new THREE.Box3().setFromObject(npc);
                        const size = box.getSize(new THREE.Vector3());
                        const scale = 1.4 / size.y;
                        npc.scale.setScalar(scale);
                        box.setFromObject(npc);
                        npc.position.y = -box.min.y;
                        npc.position.x = (Math.random() - 0.5) * 40;
                        npc.position.z = (Math.random() - 0.5) * 40;
                        npc.rotation.y = Math.random() * Math.PI * 2;
                        scene.add(npc);
                        if (gltf.animations && gltf.animations.length) {
                            const m = new THREE.AnimationMixer(npc);
                            m.clipAction(gltf.animations[0]).play();
                            remoteMixers.push(m);
                        }
                    }
                    console.log('NPCs spawned');
                },
                undefined,
                (err) => console.warn('NPC load failed', err)
            );

            // Simple tools still attached to the group (positioned roughly at hand height)
            function createAxe() {
                const group = new THREE.Group();
                const handle = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.04, 0.04, 0.7, 8),
                    new THREE.MeshLambertMaterial({ color: 0x8B4513 })
                );
                handle.position.y = 0.35;
                group.add(handle);
                const head = new THREE.Mesh(
                    new THREE.BoxGeometry(0.35, 0.16, 0.05),
                    new THREE.MeshLambertMaterial({ color: 0x708090 })
                );
                head.position.set(0.1, 0.7, 0);
                group.add(head);
                group.position.set(0.35, 1.1, 0.2);
                return group;
            }

            function createPickaxe() {
                const group = new THREE.Group();
                const handle = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.04, 0.04, 0.75, 8),
                    new THREE.MeshLambertMaterial({ color: 0x8B4513 })
                );
                handle.position.y = 0.38;
                group.add(handle);
                const head = new THREE.Mesh(
                    new THREE.BoxGeometry(0.5, 0.08, 0.06),
                    new THREE.MeshLambertMaterial({ color: 0xA9A9A9 })
                );
                head.position.set(0, 0.75, 0);
                group.add(head);
                group.position.set(0.35, 1.1, 0.2);
                return group;
            }

            const axe = createAxe();
            const pickaxe = createPickaxe();
            characterGroup.add(axe);
            characterGroup.add(pickaxe);
            pickaxe.visible = false;

            let currentTool = 'axe';
            function updateToolUI() {
                document.getElementById('toolName').textContent = currentTool === 'axe' ? 'Axe' : 'Pickaxe';
                axe.visible = currentTool === 'axe';
                pickaxe.visible = currentTool === 'pickaxe';
            }
            updateToolUI();

            const inventory = { wood: 0, stone: 0 };
            function updateInventoryUI() {
                document.getElementById('woodCount').textContent = inventory.wood;
                document.getElementById('stoneCount').textContent = inventory.stone;
            }

            // Swing: play attack animation if available, plus a simple tool rotation
            let swinging = false;
            let swingTime = 0;
            const swingDuration = 0.6;

            function startSwing() {
                if (swinging) return;
                swinging = true;
                swingTime = 0;
                if (attackAction) {
                    attackAction.reset().play();
                    attackAction.setLoop(THREE.LoopOnce);
                    attackAction.clampWhenFinished = true;
                }
                tryGather();
            }

            function updateSwing(delta) {
                if (!swinging) return;
                swingTime += delta;
                const t = Math.min(swingTime / swingDuration, 1);
                const swingT = Math.sin(t * Math.PI);
                const tool = currentTool === 'axe' ? axe : pickaxe;
                if (currentTool === 'axe') {
                    tool.rotation.x = -1.2 * swingT;
                    tool.rotation.z = -0.6 * swingT;
                } else {
                    tool.rotation.x = 0.8 - 1.6 * swingT;
                }
                if (t >= 1) {
                    swinging = false;
                    tool.rotation.set(0, 0, 0);
                    if (idleAction && attackAction) {
                        attackAction.stop();
                        idleAction.play();
                    }
                }
            }

            // Minimap
            const minimapCanvas = document.getElementById('minimap');
            const minimapCtx = minimapCanvas.getContext('2d');
            const mapSize = 180;
            const mapScale = 1.8;
            const mapRange = 50;

            function drawMinimap() {
                const ctx = minimapCtx;
                ctx.clearRect(0, 0, mapSize, mapSize);
                ctx.beginPath();
                ctx.arc(mapSize / 2, mapSize / 2, mapSize / 2 - 2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(20,40,20,0.75)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();

                const px = characterGroup.position.x;
                const pz = characterGroup.position.z;
                const facing = characterGroup.rotation.y;

                for (const c of allColliders) {
                    if (!c.type) continue;
                    const dx = c.x - px;
                    const dz = c.z - pz;
                    if (Math.abs(dx) > mapRange || Math.abs(dz) > mapRange) continue;
                    const mx = mapSize / 2 + dx * mapScale;
                    const mz = mapSize / 2 + dz * mapScale;
                    ctx.beginPath();
                    ctx.arc(mx, mz, c.type === 'tree' ? 3 : 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = c.type === 'tree' ? '#228B22' : '#888888';
                    ctx.fill();
                }

                ctx.save();
                ctx.translate(mapSize / 2, mapSize / 2);
                ctx.rotate(facing);
                ctx.beginPath();
                ctx.moveTo(0, -8);
                ctx.lineTo(5, 6);
                ctx.lineTo(-5, 6);
                ctx.closePath();
                ctx.fillStyle = '#4169E1';
                ctx.fill();
                ctx.restore();
            }

            // Camera orbit
            let cameraYaw = Math.PI;
            let cameraPitch = 0.25;
            let cameraDistance = 8;
            const minCameraDistance = 2.2;
            const maxCameraDistance = 28;
            const cameraHeight = 2.2;
            let isOrbiting = false;
            let lastMouseX = 0;
            let lastMouseY = 0;
            const orbitSensitivity = 0.005;

            // Movement
            const keys = { w: false, a: false, s: false, d: false, shift: false, space: false, e: false };
            const baseSpeed = 10;
            const turnSpeed = 2.2;
            const sprintMultiplier = 2;
            const jumpSpeed = 8;
            const gravity = 25;
            let verticalVelocity = 0;
            let onGround = true;
            const characterRadius = 0.6;

            // Chunks
            const chunkSize = CHUNK_SIZE;
            const loadedChunks = new Map();
            const allColliders = [];

            function generateChunk(cx, cz) {
                const key = `${cx},${cz}`;
                if (loadedChunks.has(key)) return;

                const group = new THREE.Group();
                group.position.set(cx * chunkSize, 0, cz * chunkSize);

                const colliders = [];
                for (const item of chunkResources(cx, cz)) {
                    const hits = resourceHits.has(item.id) ? resourceHits.get(item.id) : item.hits;
                    if (hits <= 0) continue;

                    const meshes = [];
                    if (item.type === 'tree') {
                        const trunk = new THREE.Mesh(
                            new THREE.CylinderGeometry(0.3, 0.45, 3, 8),
                            new THREE.MeshLambertMaterial({ color: 0x8B4513 })
                        );
                        trunk.position.set(item.px, 1.5, item.pz);
                        trunk.castShadow = true;
                        group.add(trunk);

                        const leaves = new THREE.Mesh(
                            new THREE.ConeGeometry(1.6, 3.2, 8),
                            new THREE.MeshLambertMaterial({ color: 0x2E8B57 })
                        );
                        leaves.position.set(item.px, 4.2, item.pz);
                        leaves.castShadow = true;
                        group.add(leaves);
                        meshes.push(trunk, leaves);
                    } else {
                        const rock = new THREE.Mesh(
                            new THREE.BoxGeometry(item.sx, item.sy, item.sz),
                            new THREE.MeshLambertMaterial({ color: 0x696969 })
                        );
                        rock.position.set(item.px, item.sy / 2, item.pz);
                        rock.castShadow = true;
                        group.add(rock);
                        meshes.push(rock);
                    }

                    const collider = {
                        id: item.id,
                        x: item.x,
                        z: item.z,
                        r: (item.type === 'tree' ? 0.5 : 0.9) + characterRadius,
                        type: item.type,
                        hits,
                        meshes,
                        parent: group
                    };
                    colliders.push(collider);
                    colliderById.set(item.id, collider);
                }

                scene.add(group);
                loadedChunks.set(key, { group, colliders });
                colliders.forEach(c => allColliders.push(c));
            }

            function removeCollider(c) {
                const idx = allColliders.indexOf(c);
                if (idx !== -1) allColliders.splice(idx, 1);
                colliderById.delete(c.id);
                for (const data of loadedChunks.values()) {
                    const ci = data.colliders.indexOf(c);
                    if (ci !== -1) data.colliders.splice(ci, 1);
                }
            }

            function removeNode(c) {
                c.meshes.forEach(m => {
                    c.parent.remove(m);
                    if (m.geometry) m.geometry.dispose();
                    if (m.material) m.material.dispose();
                });
                removeCollider(c);
            }

            function applyResourceState(id, hits) {
                resourceHits.set(id, hits);
                const c = colliderById.get(id);
                if (hits <= 0) {
                    if (c) removeNode(c);
                } else if (c) {
                    c.hits = hits;
                }
            }

            function tryGather() {
                const px = characterGroup.position.x;
                const pz = characterGroup.position.z;
                const gatherRange = 2.8;
                let closest = null;
                let closestDist = gatherRange;

                for (const c of allColliders) {
                    if (!c.type) continue;
                    const dx = px - c.x;
                    const dz = pz - c.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    if (dist < closestDist) {
                        if ((currentTool === 'axe' && c.type === 'tree') ||
                            (currentTool === 'pickaxe' && c.type === 'rock')) {
                            closest = c;
                            closestDist = dist;
                        }
                    }
                }

                if (!closest) return;
                if (!gameSocket || gameSocket.readyState !== WebSocket.OPEN) {
                    showMessage('Not connected');
                    return;
                }
                gameSocket.send(JSON.stringify({
                    type: 'gather',
                    id: closest.id,
                    x: px,
                    y: characterGroup.position.y,
                    z: pz,
                    tool: currentTool
                }));
            }

            function unloadDistantChunks(playerX, playerZ) {
                const currentCX = Math.floor(playerX / chunkSize);
                const currentCZ = Math.floor(playerZ / chunkSize);
                const keepDistance = 3;
                for (const [key, data] of loadedChunks.entries()) {
                    const [cx, cz] = key.split(',').map(Number);
                    if (Math.abs(cx - currentCX) > keepDistance || Math.abs(cz - currentCZ) > keepDistance) {
                        scene.remove(data.group);
                        data.group.traverse(obj => {
                            if (obj.geometry) obj.geometry.dispose();
                            if (obj.material) {
                                if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                                else obj.material.dispose();
                            }
                        });
                        data.colliders.forEach(c => {
                            const idx = allColliders.indexOf(c);
                            if (idx !== -1) allColliders.splice(idx, 1);
                            colliderById.delete(c.id);
                        });
                        loadedChunks.delete(key);
                    }
                }
            }

            function updateChunks() {
                const px = characterGroup.position.x;
                const pz = characterGroup.position.z;
                const currentCX = Math.floor(px / chunkSize);
                const currentCZ = Math.floor(pz / chunkSize);
                for (let dx = -2; dx <= 2; dx++) {
                    for (let dz = -2; dz <= 2; dz++) {
                        generateChunk(currentCX + dx, currentCZ + dz);
                    }
                }
                if (Math.random() < 0.05) unloadDistantChunks(px, pz);
            }

            updateChunks();

            // Input
            document.addEventListener('keydown', (e) => {
                if (e.target && e.target.tagName === 'INPUT') return;
                const k = e.key.toLowerCase();
                if (k in keys) keys[k] = true;
                if (e.key === 'Shift') keys.shift = true;
                if (e.key === ' ') {
                    keys.space = true;
                    e.preventDefault();
                }
                if (e.key === '1') { currentTool = 'axe'; updateToolUI(); }
                if (e.key === '2') { currentTool = 'pickaxe'; updateToolUI(); }
                if (k === 'e') startSwing();
            });
            document.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k in keys) keys[k] = false;
                if (e.key === 'Shift') keys.shift = false;
                if (e.key === ' ') keys.space = false;
            });

            renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
            renderer.domElement.addEventListener('mousedown', (e) => {
                if (e.button === 2) {
                    isOrbiting = true;
                    lastMouseX = e.clientX;
                    lastMouseY = e.clientY;
                    e.preventDefault();
                }
            });
            window.addEventListener('mouseup', (e) => {
                if (e.button === 2) isOrbiting = false;
            });
            window.addEventListener('mousemove', (e) => {
                if (!isOrbiting) return;
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                cameraYaw -= dx * orbitSensitivity;
                cameraPitch -= dy * orbitSensitivity;
                cameraPitch = Math.max(-0.4, Math.min(1.2, cameraPitch));
            });
            renderer.domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomStep = Math.max(0.4, cameraDistance * 0.12);
                cameraDistance += Math.sign(e.deltaY) * zoomStep;
                cameraDistance = Math.max(minCameraDistance, Math.min(maxCameraDistance, cameraDistance));
            }, { passive: false });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            function resolveCollisions(pos) {
                for (const c of allColliders) {
                    const dx = pos.x - c.x;
                    const dz = pos.z - c.z;
                    const distSq = dx * dx + dz * dz;
                    const minDist = c.r;
                    if (distSq < minDist * minDist && distSq > 0.0001) {
                        const dist = Math.sqrt(distSq);
                        const overlap = minDist - dist;
                        pos.x += (dx / dist) * overlap;
                        pos.z += (dz / dist) * overlap;
                    }
                }
            }

            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const delta = Math.min(clock.getDelta(), 0.05);

                if (keys.a) characterGroup.rotation.y += turnSpeed * delta;
                if (keys.d) characterGroup.rotation.y -= turnSpeed * delta;

                const angle = characterGroup.rotation.y;
                const forward = new THREE.Vector3(Math.sin(angle), 0, Math.cos(angle));
                let moveSpeed = baseSpeed * (keys.shift ? sprintMultiplier : 1);
                const move = new THREE.Vector3();

                if (keys.w) move.add(forward);
                if (keys.s) move.sub(forward);

                if (move.lengthSq() > 0) {
                    move.normalize().multiplyScalar(moveSpeed * delta);
                    characterGroup.position.add(move);
                }

                resolveCollisions(characterGroup.position);

                if (keys.space && onGround) {
                    verticalVelocity = jumpSpeed;
                    onGround = false;
                }
                if (!onGround) {
                    verticalVelocity -= gravity * delta;
                    characterGroup.position.y += verticalVelocity * delta;
                    if (characterGroup.position.y <= 0) {
                        characterGroup.position.y = 0;
                        verticalVelocity = 0;
                        onGround = true;
                    }
                }

                updateSwing(delta);
                if (mixer) mixer.update(delta);
                for (const remoteMixer of remoteMixers) remoteMixer.update(delta);
                drawMinimap();

                const camTarget = characterGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0));
                const offset = new THREE.Vector3(
                    Math.sin(cameraYaw) * cameraDistance,
                    cameraHeight + Math.sin(cameraPitch) * 3,
                    Math.cos(cameraYaw) * cameraDistance
                );
                camera.position.copy(characterGroup.position).add(offset);
                camera.lookAt(camTarget);

                updateChunks();
                renderer.render(scene, camera);
            }
            animate();

            console.log('Open World Prototype with external GLB character started');

            // --- Multiplayer ---
            const remotePlayers = new Map();
            let myId = null;

            function makeNameSprite(name, color) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, 256, 64);
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(16, 8, 224, 48);
                ctx.fillStyle = color || '#ffffff';
                ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText((name || 'Player').slice(0, 16), 128, 32);
                const tex = new THREE.CanvasTexture(canvas);
                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
                sprite.scale.set(2.4, 0.6, 1);
                sprite.position.y = 2.6;
                sprite.userData.texture = tex;
                return sprite;
            }

            function tintModel(root, color) {
                const tint = new THREE.Color(color || '#ffffff');
                root.traverse(obj => {
                    if (!obj.isMesh || !obj.material) return;
                    const source = Array.isArray(obj.material) ? obj.material : [obj.material];
                    const cloned = source.map(mat => {
                        const next = mat.clone();
                        if (next.color) next.color.lerp(tint, 0.35);
                        return next;
                    });
                    obj.material = Array.isArray(obj.material) ? cloned : cloned[0];
                });
            }

            function attachPlayerModel(group, color) {
                if (!playerTemplate) return false;
                const model = cloneSkinned(playerTemplate);
                tintModel(model, color);
                group.add(model);
                if (playerClips.length) {
                    const remoteMixer = new THREE.AnimationMixer(model);
                    remoteMixer.clipAction(playerClips[0]).play();
                    remoteMixers.push(remoteMixer);
                    group.userData.mixer = remoteMixer;
                }
                group.userData.hasModel = true;
                return true;
            }

            function createRemotePlayer(p) {
                const group = new THREE.Group();
                group.position.set(p.x || 0, p.y || 0, p.z || 0);
                group.rotation.y = p.rotY || 0;
                if (!attachPlayerModel(group, p.color)) {
                    const body = new THREE.Mesh(
                        new THREE.CapsuleGeometry(0.4, 1.0, 4, 8),
                        new THREE.MeshLambertMaterial({ color: p.color || 0xff4444 })
                    );
                    body.position.y = 1.0;
                    body.castShadow = true;
                    group.add(body);
                    group.userData.fallback = body;
                }
                const label = makeNameSprite(p.name, p.color);
                group.add(label);
                group.userData.label = label;
                scene.add(group);
                return group;
            }

            function setRemoteLabel(entry, name, color) {
                const old = entry.mesh.userData.label;
                if (old) {
                    entry.mesh.remove(old);
                    if (old.material) old.material.dispose();
                    if (old.userData.texture) old.userData.texture.dispose();
                }
                const label = makeNameSprite(name, color || entry.data.color);
                entry.mesh.add(label);
                entry.mesh.userData.label = label;
            }

            function upgradeRemotePlayers() {
                for (const entry of remotePlayers.values()) {
                    if (entry.mesh.userData.hasModel) continue;
                    if (entry.mesh.userData.fallback) {
                        entry.mesh.remove(entry.mesh.userData.fallback);
                        entry.mesh.userData.fallback = null;
                    }
                    attachPlayerModel(entry.mesh, entry.data.color);
                }
            }

            function ensureRemote(p) {
                let entry = remotePlayers.get(p.id);
                if (!entry) {
                    const mesh = createRemotePlayer(p);
                    entry = { mesh, data: p };
                    remotePlayers.set(p.id, entry);
                }
                return entry;
            }

            nameInput.addEventListener('change', () => {
                playerName = nameInput.value.trim().slice(0, 16) || 'Player';
                nameInput.value = playerName;
                localStorage.setItem('ow-name', playerName);
                if (gameSocket && gameSocket.readyState === WebSocket.OPEN) {
                    gameSocket.send(JSON.stringify({ type: 'rename', name: playerName }));
                }
            });

            function connectMultiplayer() {
                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                const ws = new WebSocket(`${protocol}//${location.host}`);
                gameSocket = ws;

                ws.onopen = () => {
                    console.log('Connected to multiplayer server');
                    showMessage('Connected to server');
                    ws.send(JSON.stringify({ type: 'hello', persistentId, name: playerName }));
                };

                ws.onmessage = (ev) => {
                    const data = JSON.parse(ev.data);
                    if (data.type === 'welcome') {
                        myId = data.id;
                        if (data.id && data.id !== persistentId) {
                            persistentId = data.id;
                            localStorage.setItem('ow-id', persistentId);
                        }
                        if (data.name) {
                            playerName = data.name;
                            nameInput.value = data.name;
                            localStorage.setItem('ow-name', data.name);
                        }
                        if (data.color) {
                            document.getElementById('playerColor').style.background = data.color;
                        }
                        if (data.inventory) {
                            inventory.wood = data.inventory.wood || 0;
                            inventory.stone = data.inventory.stone || 0;
                            updateInventoryUI();
                        }
                        if (data.resources) {
                            for (const [id, hits] of Object.entries(data.resources)) {
                                applyResourceState(id, hits);
                            }
                        }
                        (data.players || []).forEach(p => {
                            if (p.id !== myId) ensureRemote(p);
                        });
                    } else if (data.type === 'join' && data.id !== myId) {
                        ensureRemote(data);
                    } else if (data.type === 'update' && data.id !== myId) {
                        const entry = ensureRemote(data);
                        entry.mesh.position.set(data.x, data.y, data.z);
                        entry.mesh.rotation.y = data.rotY;
                        entry.data = data;
                    } else if (data.type === 'rename' && data.id !== myId) {
                        const entry = remotePlayers.get(data.id);
                        if (entry) {
                            entry.data.name = data.name;
                            entry.data.color = data.color || entry.data.color;
                            setRemoteLabel(entry, data.name, entry.data.color);
                        }
                    } else if (data.type === 'leave') {
                        const entry = remotePlayers.get(data.id);
                        if (entry) {
                            scene.remove(entry.mesh);
                            remotePlayers.delete(data.id);
                        }
                    } else if (data.type === 'resource') {
                        applyResourceState(data.id, data.hits);
                    } else if (data.type === 'gatherResult') {
                        if (data.id != null && data.hits != null) applyResourceState(data.id, data.hits);
                        if (data.inventory) {
                            inventory.wood = data.inventory.wood || 0;
                            inventory.stone = data.inventory.stone || 0;
                            updateInventoryUI();
                        }
                        if (!data.ok) showMessage(data.reason || 'Cannot gather');
                        else if (data.gained === 'wood') showMessage('+1 Wood');
                        else if (data.gained === 'stone') showMessage('+1 Stone');
                        else showMessage('Hit');
                    }
                };

                const sendTimer = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN && myId) {
                        ws.send(JSON.stringify({
                            type: 'update',
                            x: characterGroup.position.x,
                            y: characterGroup.position.y,
                            z: characterGroup.position.z,
                            rotY: characterGroup.rotation.y,
                            tool: currentTool
                        }));
                    }
                }, 100);

                ws.onclose = () => {
                    clearInterval(sendTimer);
                    if (gameSocket === ws) gameSocket = null;
                    showMessage('Disconnected from server');
                    setTimeout(connectMultiplayer, 3000);
                };
            }

            setTimeout(connectMultiplayer, 500);
        } catch (err) {
            showError(err.message || err);
        }
    </script>
</body>
</html>
